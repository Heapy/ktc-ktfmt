name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: Heapy/setup-ktc@cc63216665ce07ce0709fe52ef4a4b0b63aeaddc # v1.1.0
        with:
          version: auto
          cache-konan: false
      - name: Build and check
        shell: bash
        run: |
          ./kotlin build
          ./kotlin check
      - name: Consumer smoke test
        shell: bash
        run: python3 scripts/smoke.py
