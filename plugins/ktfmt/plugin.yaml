tasks:
  ktfmtCheck:
    action: !io.heapy.ktc.plugins.ktfmt.checkFormatting
      moduleRoot: ${module.rootDir}
      settings: ${pluginSettings}
  ktfmtFormat:
    action: !io.heapy.ktc.plugins.ktfmt.formatSources
      moduleRoot: ${module.rootDir}
      settings: ${pluginSettings}

checks:
  - ktfmtCheck

commands:
  - ktfmtFormat
